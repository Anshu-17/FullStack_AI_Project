[project]
name = "business-evidence-platform"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]  # autogenerated, reviewed by hand

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency style `db: Session = Depends(get_db)` is intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # env vars must be set before importing the app
"migrations/env.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
